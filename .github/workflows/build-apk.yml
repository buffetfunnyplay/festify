name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Build do Site
        run: npm run build

      - name: Configurar Supabase
        run: |
          echo "VITE_SUPABASE_URL=${{ vars.SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_KEY=${{ vars.SUPABASE_KEY }}" >> .env

      - name: Compilar APK Android
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          sed -i 's/sourceCompatibility JavaVersion.VERSION_11/sourceCompatibility JavaVersion.VERSION_21/g' app/build.gradle || true
          sed -i 's/targetCompatibility JavaVersion.VERSION_11/targetCompatibility JavaVersion.VERSION_21/g' app/build.gradle || true
          ./gradlew assembleRelease

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.unsigned.apk
